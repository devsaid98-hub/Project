<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Viewer</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      background:#0f172a;
      color:white;
    }

    #viewer{
      width:100vw;
      height:100vh;
    }

    .panel{
      position:absolute;
      top:20px;
      right:20px;
      width:300px;
      background:rgba(15,23,42,0.9);
      border-radius:16px;
      padding:16px;
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      z-index:10;
    }

    .panel h2{
      margin-bottom:15px;
      font-size:22px;
    }

    .group{
      margin-bottom:14px;
    }

    .group label{
      display:block;
      margin-bottom:6px;
      color:#cbd5e1;
      font-size:14px;
    }

    .group input,
    .group select,
    .group button{
      width:100%;
      padding:10px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    .group input[type="color"]{
      height:45px;
      padding:4px;
      cursor:pointer;
    }

    button{
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .loading{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      background:#000000aa;
      padding:15px 25px;
      border-radius:12px;
      display:none;
      z-index:100;
    }

    .info{
      position:absolute;
      bottom:20px;
      left:20px;
      background:#00000088;
      padding:12px;
      border-radius:12px;
      font-size:13px;
      line-height:1.7;
    }
  </style>
</head>

<body>

<div id="viewer"></div>

<div class="panel">
  <h2>3D Viewer</h2>

  <div class="group">
    <label>رابط موديل GLB / GLTF</label>
    <input
      type="text"
      id="modelUrl"
      placeholder="ضع رابط الموديل هنا"
      value=""
    />
  </div>

  <div class="group">
    <button onclick="loadModel()">تحميل الموديل</button>
  </div>

  <div class="group">
    <label>لون المادة</label>
    <input type="color" id="colorPicker" value="#ffffff"/>
  </div>

  <div class="group">
    <label>نوع المادة</label>

    <select id="materialType">
      <option value="standard">MeshStandardMaterial</option>
      <option value="physical">MeshPhysicalMaterial</option>
      <option value="toon">MeshToonMaterial</option>
      <option value="normal">MeshNormalMaterial</option>
    </select>
  </div>

  <div class="group">
    <label>الشفافية</label>
    <input
      type="range"
      id="opacity"
      min="0"
      max="1"
      step="0.01"
      value="1"
    />
  </div>

  <div class="group">
    <label>الخشونة Roughness</label>
    <input
      type="range"
      id="roughness"
      min="0"
      max="1"
      step="0.01"
      value="0.5"
    />
  </div>

  <div class="group">
    <label>الانعكاس Metalness</label>
    <input
      type="range"
      id="metalness"
      min="0"
      max="1"
      step="0.01"
      value="0.5"
    />
  </div>

  <div class="group">
    <button onclick="applyMaterial()">تطبيق المادة</button>
  </div>
</div>

<div class="loading" id="loading">
  جاري تحميل الموديل...
</div>

<div class="info">
  دوران: زر الماوس الأيسر<br>
  تحريك: زر الماوس الأيمن<br>
  تكبير: عجلة الماوس
</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

import { OrbitControls }
from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

import { GLTFLoader }
from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

let scene;
let camera;
let renderer;
let controls;
let currentModel = null;

init();
animate();

function init(){

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0,1.5,4);

  renderer = new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled = true;

  document
    .getElementById('viewer')
    .appendChild(renderer.domElement);

  controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;

  // إضاءة

  const hemiLight = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
  );

  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(
    0xffffff,
    3
  );

  dirLight.position.set(5,10,7);

  dirLight.castShadow = true;

  scene.add(dirLight);

  // أرضية

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshStandardMaterial({
      color:0x222222
    })
  );

  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1;

  ground.receiveShadow = true;

  scene.add(ground);

  // Grid

  const grid = new THREE.GridHelper(
    20,
    20,
    0x666666,
    0x444444
  );

  scene.add(grid);

  window.addEventListener(
    'resize',
    onWindowResize
  );
}

function onWindowResize(){

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);
}

window.loadModel = function(){

  const url =
    document.getElementById('modelUrl').value;

  if(!url){

    alert('ضع رابط الموديل');

    return;
  }

  document.getElementById('loading').style.display =
    'block';

  const loader = new GLTFLoader();

  loader.load(

    url,

    function(gltf){

      // حذف الموديل القديم

      if(currentModel){

        scene.remove(currentModel);
      }

      currentModel = gltf.scene;

      currentModel.traverse(function(child){

        if(child.isMesh){

          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(currentModel);

      // توسيط الموديل

      const box = new THREE.Box3()
        .setFromObject(currentModel);

      const center = box.getCenter(
        new THREE.Vector3()
      );

      currentModel.position.sub(center);

      const size = box.getSize(
        new THREE.Vector3()
      ).length();

      camera.position.set(
        0,
        size * 0.3,
        size * 1.2
      );

      controls.update();

      document.getElementById('loading').style.display =
        'none';
    },

    function(xhr){

      console.log(
        (xhr.loaded / xhr.total * 100) +
        '% loaded'
      );
    },

    function(error){

      console.error(error);

      document.getElementById('loading').style.display =
        'none';

      alert(
        'خطأ في تحميل الموديل\\n\\n' +
        error.message
      );
    }
  );
}

window.applyMaterial = function(){

  if(!currentModel){

    alert('قم بتحميل موديل أولاً');

    return;
  }

  const color =
    document.getElementById('colorPicker').value;

  const type =
    document.getElementById('materialType').value;

  const opacity =
    parseFloat(
      document.getElementById('opacity').value
    );

  const roughness =
    parseFloat(
      document.getElementById('roughness').value
    );

  const metalness =
    parseFloat(
      document.getElementById('metalness').value
    );

  currentModel.traverse(function(child){

    if(child.isMesh){

      let material;

      switch(type){

        case 'physical':

          material =
            new THREE.MeshPhysicalMaterial({

              color:color,
              roughness:roughness,
              metalness:metalness,
              transparent:true,
              opacity:opacity,
              clearcoat:1
            });

          break;

        case 'toon':

          material =
            new THREE.MeshToonMaterial({

              color:color,
              transparent:true,
              opacity:opacity
            });

          break;

        case 'normal':

          material =
            new THREE.MeshNormalMaterial({

              transparent:true,
              opacity:opacity
            });

          break;

        default:

          material =
            new THREE.MeshStandardMaterial({

              color:color,
              roughness:roughness,
              metalness:metalness,
              transparent:true,
              opacity:opacity
            });
      }

      child.material = material;
    }
  });
}

</script>

</body>
</html>

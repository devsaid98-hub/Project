<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Viewer with Loading</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
    }

    /* ================= LOADING SCREEN ================= */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
    }

    .loader-text {
      margin-bottom: 20px;
      font-size: 18px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #444;
      border-top: 4px solid #00ffcc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<!-- 🔥 Loading Screen -->
<div id="loading-screen">
  <div class="loader-text">Loading 3D Model... 0%</div>
  <div class="spinner"></div>
</div>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

console.log("App started ✔");

const loadingScreen = document.getElementById("loading-screen");

// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1, 5);

// ================= RENDERER =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ================= CONTROLS =================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ================= LIGHTS =================
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 5, 5);
scene.add(light);

// ================= TEST CUBE =================
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x00ff00 })
);
scene.add(cube);

// ================= LOADER =================
const loader = new GLTFLoader();

// 🔥 Progress tracking
loader.manager.onProgress = function (url, loaded, total) {
  const percent = ((loaded / total) * 100).toFixed(0);
  loadingScreen.querySelector(".loader-text").innerText =
    `Loading 3D Model... ${percent}%`;
};

// ================= LOAD MODEL =================
loader.load(
  './model.glb',

  function (gltf) {
    scene.add(gltf.scene);

    // إخفاء شاشة التحميل
    loadingScreen.style.display = "none";

    console.log("Model loaded ✔");
  },

  undefined,

  function (error) {
    console.error("Model error:", error);
    loadingScreen.querySelector(".loader-text").innerText =
      "Failed to load model ❌";
  }
);

// ================= ANIMATE =================
function animate() {
  requestAnimationFrame(animate);

  cube.rotation.y += 0.01;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ================= RESIZE =================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
